[workspace]
members = [
    "jexl-3000",
    "jexl-eval",
    "jexl-node",
    "jexl-parser",
    # "jexl-python",
    "jexl-wasm",
    "parser-gen",
    "tree-sitter-jexl3000"
]
exclude = ["jexl-serverless", "jexl-python"]
resolver = "3"

[workspace.dependencies]
regex-lite = "0.1.9"
serde = "1.0"
serde_json = "1.0"
tikv-jemallocator = "0.5"
thiserror = "1.0.38"
time = { version = "0.3.19", features = ["macros"] }
lalrpop = { version = "0.23", features = ["lexer"] }
lalrpop-util = { version = "0.23", features = ["lexer"] }
